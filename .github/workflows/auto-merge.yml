name: Dependabot auto-merge
on: pull_request

env:
  # Mirrors ci.yml so lockfile regeneration runs on the same earliest Node
  # that CI uses to validate the repository.
  DEFAULT_MATRIX_NODE_VERSION: '["22", "24", "26"]'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Dependabot can generate a package-lock.json with a newer npm version.
      # Regenerate it with the earliest Node/npm from the CI matrix so the
      # lockfile remains compatible with every supported matrix entry.
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - id: matrix
        shell: bash
        run: |
          value='${{ vars.MATRIX_NODE_VERSION || env.DEFAULT_MATRIX_NODE_VERSION }}'
          echo "node-version=$value" >> "$GITHUB_OUTPUT"

      - uses: kt-workflows/actions/setup-node-minmax@main
        with:
          matrix-node-version: ${{ steps.matrix.outputs.node-version }}
          matrix-node-version-earliest: true

      - name: Regenerate package-lock.json on earliest Node
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already compatible with earliest Node — nothing to do"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m "Regenerate package-lock.json on earliest Node"
          git push origin HEAD:${{ github.head_ref }}

      - id: app-token
        name: Create token for auto-merge
        uses: kt-workflows/actions/create-github-app-token@main
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          configure-git: false
          default-to-github-token: false

      - id: metadata
        name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      # Enable auto-merge first. GitHub will merge only after required CI checks
      # and branch protection requirements have passed.
      - name: Enable auto-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Enabling auto-merge for $PR_URL"
          gh pr merge --auto --squash "$PR_URL"

      - id: approve-app-token
        name: Create token for approving PR
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        uses: kt-workflows/actions/create-github-app-token@main
        with:
          app-id: ${{ secrets.APPROVE_APP_ID }}
          private-key: ${{ secrets.APPROVE_APP_PRIVATE_KEY }}
          configure-git: false
          default-to-github-token: false

      - name: Approve Dependabot PR
        if: steps.approve-app-token.outputs.token != ''
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.approve-app-token.outputs.token }}
        run: |
          echo "Approving $PR_URL"
          gh pr review --approve --body "Approved! Servus! 🤖" "$PR_URL"
